<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bird" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded App Tile -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#fbbf24" stroke-width="12"/>

  <!-- Flappy Bird Body -->
  <ellipse cx="230" cy="270" rx="140" ry="110" fill="url(#bird)" stroke="#543847" stroke-width="18"/>

  <!-- Belly -->
  <ellipse cx="205" cy="310" rx="100" ry="60" fill="#fef08a"/>

  <!-- Wing -->
  <ellipse cx="160" cy="275" rx="65" ry="42" fill="#ffffff" stroke="#543847" stroke-width="16"/>

  <!-- Eye -->
  <ellipse cx="305" cy="225" rx="36" ry="44" fill="#ffffff" stroke="#543847" stroke-width="16"/>
  <ellipse cx="320" cy="225" rx="16" ry="22" fill="#000000"/>
  <ellipse cx="326" cy="215" rx="6" ry="8" fill="#ffffff"/>

  <!-- Beak -->
  <path d="M 330 260 L 440 290 L 330 325 Z" fill="#f97316" stroke="#543847" stroke-width="16" stroke-linejoin="round"/>
  <path d="M 330 290 L 400 295" stroke="#543847" stroke-width="12" stroke-linecap="round"/>
</svg>
