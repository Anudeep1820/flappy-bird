<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1017">
  <title>Flappy Bird Arcade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Game Canvas -->
    <canvas id="game-canvas" width="360" height="600"></canvas>

    <!-- UI Overlay: Start Screen -->
    <div id="start-overlay" class="ui-screen">
      <div class="game-logo">
        <span class="logo-flappy">FLAPPY</span>
        <span class="logo-bird">BIRD</span>
      </div>
      <div class="tap-instruction">
        <span class="desktop-hint">[SPACE] or </span><span class="tap-hint">TAP TO FLAP</span>
      </div>
      <button id="leaderboard-btn-start" class="arcade-btn sub-btn" style="margin-top: 18px; pointer-events: auto;">
        🏆 RANKINGS
      </button>
    </div>

    <!-- UI Overlay: In-Game Score HUD -->
    <div id="hud-score" class="hud-score">0</div>

    <!-- UI Overlay: Game Over Screen -->
    <div id="gameover-overlay" class="ui-screen hidden">
      <div class="gameover-banner">GAME OVER</div>
      <div class="scoreboard-panel">
        <div class="score-row">
          <span>SCORE</span>
          <span id="final-score" class="score-val">0</span>
        </div>
        <div class="score-row">
          <span>BEST</span>
          <span id="high-score" class="score-val">0</span>
        </div>
        <div id="medal-container" class="medal-container">
          <span id="medal-label">MEDAL</span>
          <div id="medal-icon" class="medal-icon medal-none"></div>
        </div>
      </div>

      <!-- Submit Score to Global Leaderboard -->
      <div id="submit-score-section" class="submit-score-section">
        <input type="text" id="player-name-input" maxlength="12" placeholder="YOUR NAME" class="name-input" autocomplete="off" autocorrect="off">
        <button id="submit-score-btn" class="arcade-btn submit-btn">POST</button>
      </div>
      <div id="submit-status-msg" class="submit-status-msg"></div>

      <div class="gameover-actions">
        <button id="restart-btn" class="arcade-btn">PLAY AGAIN</button>
        <button id="leaderboard-btn-over" class="arcade-btn sub-btn">🏆 RANKINGS</button>
      </div>
      <div class="restart-hint">Tap anywhere to restart</div>
    </div>

    <!-- UI Overlay: Global Leaderboard Modal -->
    <div id="leaderboard-modal" class="modal-overlay hidden">
      <div class="leaderboard-content">
        <div class="leaderboard-header">
          <span class="leaderboard-title">🏆 HALL OF FAME</span>
          <button id="leaderboard-close-btn" class="close-x">&times;</button>
        </div>
        <div class="leaderboard-scroll">
          <div id="leaderboard-list" class="leaderboard-list">
            <div style="text-align: center; color: #88aacc; padding: 20px; font-size: 11px;">Loading rankings...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modular Game Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
